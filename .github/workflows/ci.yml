name: CI

on:
  push:
    branches: [main, "refactor/**", "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The linguistic core needs only kiwipiepy (morphology layer), so the
      # test job stays fast: no torch/transformers install needed.
      - name: Install test dependencies
        run: pip install pytest kiwipiepy==0.23.2
      - name: Unit tests (G2P rules, morphology, alignment, error taxonomy)
        run: python -m pytest tests/ -q
      - name: G2P held-out regression gate (core & morph must stay 100%)
        run: python experiments/exp3_g2p_heldout.py --check
      # Exp 4, scoring half only: re-scores ASR outputs saved once locally
      # (experiments/data/exp4_asr_fixture.json) — no TTS, ASR or torch here
      - name: Severity monotonicity gate on fixed ASR outputs (Exp 4)
        run: python experiments/exp4_severity_monotonicity.py --check
